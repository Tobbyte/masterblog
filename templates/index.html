<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>{{blogtitle}}</h1>
    {% if posts|length==0 %}
    <p><em>Write the first post!</em></p>
    {% endif%}
    {% for post in posts %}
    <div class="post">
        <h2>{{ post.id }}</h2>
        <h2>{{ post.title }}</h2>
        <p><em>Written by {{ post.author }}</em></p>
        <p>{{ post.content }}</p>
        <div>
            <form action="{{ url_for('route_like_post', post_id=post.id) }}" method="post">
                {%if uuid not in post["liked_by"]%}
                <input type="submit" value="❤️">
                {% else %}
                <input type="submit" value="💔">
                {% endif %}
            </form>
            {{ post.likes }}
        </div>
        <!-- button to delete post -->
        <form action="{{ url_for('route_delete', post_id=post.id) }}" method="post">
            <input type="submit" value="Delete Post">
        </form>
        <form action="{{ url_for('route_update_post', post_id=post.id) }}">
            <input type="submit" value="Update Post">
        </form>
    </div>
    {% endfor %}
    <a href="{{ url_for('route_add') }}">add Post</a>
</body>

</html>
